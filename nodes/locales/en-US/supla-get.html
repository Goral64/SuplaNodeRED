<script type="text/html" data-help-name="supla-get">
    <p>Reads the current state of a channel or a channel group from the Cloud.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">channelId <span class="property-type">number</span></dt>
        <dd>Channel ID, overrides the one set in the node.</dd>
        <dt class="optional">target <span class="property-type">object</span></dt>
        <dd><code>{"type": "channel" | "group", "id": 123}</code></dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The state, e.g. <code>{"on": true, "connected": true}</code>,
            <code>{"shut": 40, "isCalibrating": false}</code> or <code>{"temperature": 21.3}</code>.</dd>
        <dt>channel <span class="property-type">object</span></dt>
        <dd><code>{id, type, deviceId, caption, function}</code></dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>supla/channel/&lt;id&gt;</code> or <code>supla/group/&lt;id&gt;</code></dd>
    </dl>
</script>
