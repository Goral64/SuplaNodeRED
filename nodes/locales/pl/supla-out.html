<script type="text/html" data-help-name="supla-out">
    <p>Wykonuje akcję na kanale, grupie kanałów albo scenie.</p>
    <h3>Wejście</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean | number | string | object</span></dt>
        <dd>Używane, gdy w węźle nie wybrano akcji i nie ma <code>msg.action</code>:
            <ul>
                <li><code>true</code> / <code>false</code>: włącz / wyłącz; dla rolet odsłoń / zasłoń, dla bram
                    i zaworów otwórz / zamknij,</li>
                <li>liczba: procent zasłonięcia rolety, jasność ściemniacza, temperatura zadana termostatu,</li>
                <li><code>"#RRGGBB"</code>: kolor oświetlenia RGB,</li>
                <li>nazwa akcji, np. <code>"toggle"</code>, <code>"open_close"</code>, <code>"stop"</code>,</li>
                <li><code>{"action": "SHUT_PARTIALLY", "percentage": 30}</code>: akcja z parametrami.</li>
            </ul>
            Scenę uruchamia każda wiadomość.</dd>
        <dt class="optional">action <span class="property-type">string</span></dt>
        <dd>Nazwa akcji, np. <code>TURN_ON</code>, <code>SHUT_PARTIALLY</code>, <code>SET_RGBW_PARAMETERS</code>.</dd>
        <dt class="optional">params <span class="property-type">object</span></dt>
        <dd>Parametry akcji, dokładane do ustawionych w węźle, np. <code>{"percentage": 50}</code>,
            <code>{"brightness": 80}</code>, <code>{"durationMs": 60000}</code>, <code>{"temperature": 21.5}</code>.</dd>
        <dt class="optional">target <span class="property-type">object</span></dt>
        <dd><code>{"type": "channel" | "group" | "scene", "id": 123}</code>, zastępuje cel ustawiony w węźle.</dd>
        <dt class="optional">channelId <span class="property-type">number</span></dt>
        <dd>ID kanału, zastępuje kanał ustawiony w węźle.</dd>
    </dl>
    <h3>Wyjście</h3>
    <p>Gdy Cloud przyjmie akcję, wiadomość idzie dalej z <code>msg.supla</code> =
        <code>{type, id, action, params}</code>.</p>
</script>
