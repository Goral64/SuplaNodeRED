<script type="text/javascript">
RED.nodes.registerType('supla-get', {
    category: 'SUPLA',
    color: '#9fd6a3',
    defaults: {
        name: {value: ''},
        config: {value: '', type: 'supla-config', required: true},
        targetType: {value: 'channel'},
        target: {value: ''},
        targetCaption: {value: ''},
    },
    inputs: 1,
    outputs: 1,
    icon: 'supla.svg',
    paletteLabel: 'supla get',
    label: function () {
        return this.name || this.targetCaption || (this.target ? '#' + this.target : 'supla get');
    },
    onadd: function () {
        if (window.SuplaNodeRED) {
            window.SuplaNodeRED.pickConfig(this);
        }
    },
    oneditprepare: function () {
        const node = this;
        const S = window.SuplaNodeRED;
        S.pickConfigInDialog(node);
        const targetSel = $('#node-input-target');
        const status = $('#supla-get-status');

        function loadTargets(refresh) {
            const type = $('#node-input-targetType').val();
            status.text('…');
            S.load($('#node-input-config').val(), type === 'group' ? 'groups' : 'channels', refresh).then(function (items) {
                S.fill(targetSel, items, targetSel.val() || node.target);
                status.text('');
            }, function (err) {
                S.fill(targetSel, [], targetSel.val() || node.target);
                status.text(err.message);
            });
        }

        $('#node-input-targetType').on('change', function () {
            targetSel.val('');
            loadTargets(false);
        });
        $('#node-input-config').on('change', function () {
            loadTargets(false);
        });
        $('#supla-get-refresh').on('click', function () {
            loadTargets(true);
        });
        loadTargets(false);
    },
    oneditsave: function () {
        const item = window.SuplaNodeRED.itemOf($('#node-input-target'));
        this.targetCaption = item ? item.caption : '';
    },
});
</script>

<script type="text/html" data-template-name="supla-get">
    <div class="form-row">
        <label for="node-input-config"><i class="fa fa-cog"></i> <span data-i18n="supla-get.label.config"></span></label>
        <input type="text" id="node-input-config">
    </div>
    <div class="form-row">
        <label for="node-input-targetType"><i class="fa fa-crosshairs"></i> <span data-i18n="supla-get.label.targetType"></span></label>
        <select id="node-input-targetType">
            <option value="channel" data-i18n="supla-get.targetType.channel"></option>
            <option value="group" data-i18n="supla-get.targetType.group"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-target"><i class="fa fa-lightbulb-o"></i> <span data-i18n="supla-get.label.target"></span></label>
        <select id="node-input-target" style="width: calc(70% - 40px);"></select>
        <button type="button" class="red-ui-button" id="supla-get-refresh"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label></label><span id="supla-get-status" style="color: var(--red-ui-text-color-error, #c00);"></span>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="supla-get.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>
